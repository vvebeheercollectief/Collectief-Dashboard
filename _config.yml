# GitHub Pages (Jekyll legacy build). We voegen alleen een exclude-lijst toe: het bronpakket
# met logo's, het wekelijkse HTML-deck, het gereedschap en de Apps Script-broncode horen NIET
# op de publieke site. De app zelf
# (index.html, src/, styles.css, sw.js, manifest.json, iconen, allowed-emails.js en de
# losse logo-*.png in de root) heeft geen underscore-prefix en staat niet in de lijst,
# dus die wordt gewoon gepubliceerd.
exclude:
  - logo-pakket
  - vrijdagsoverzicht.html
  # Meekijk-simulatie voor besturen: een losse pagina die apart wordt gedeeld, niet via deze site.
  - simulatie
  - .superpowers
  - apps-script
  - apps-script-backup
  # `tools/` staat er sinds v10.31 bij: tools/syntaxcheck.js was publiek op te vragen
  # (nagemeten: HTTP 200). Geen sleutels, wel intern gereedschap dat niets op de
  # publieke site te zoeken heeft. Let op: 'tools' matcht op PREFIX, dus zet hier nooit
  # een kortere variant neer.
  - tools
  - README.md
  - BRAND-GUIDELINES.md
  - package.json
  - package-lock.json
# Let op: Jekyll matcht deze regels ook op PREFIX — 'apps-script' weert daardoor ook
# apps-script-backup. Zet hier daarom NOOIT een korte regel als 'src' of 'index': dan
# verdwijnt de app zelf van de site. 'apps-script-backup' staat er expliciet bij zodat het
# niet van die prefix-toevalligheid afhangt.
