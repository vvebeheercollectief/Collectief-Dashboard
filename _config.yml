# GitHub Pages (Jekyll legacy build). We voegen alleen een exclude-lijst toe: interne
# mockups, presentatie-decks, het bronpakket met logo's, het wekelijkse HTML-deck, de
# specs/plannen en de Apps Script-broncode horen NIET op de publieke site. De app zelf
# (index.html, src/, styles.css, sw.js, manifest.json, iconen, allowed-emails.js en de
# losse logo-*.png in de root) heeft geen underscore-prefix en staat niet in de lijst,
# dus die wordt gewoon gepubliceerd.
exclude:
  # De broncode van de Vercel-proxy hoort niet op de publieke site. Er staan geen sleutels in
  # (die komen uit process.env), maar de hele toegangscontrole — origins, verwachte OAuth-client,
  # allowlist-logica — stond zo wél te lezen op vvebeheercollectief.github.io/.../api/chat.js
  # (nagemeten: HTTP 200). Vercel leest deze regel niet, dus de functie zelf blijft gewoon draaien.
  # 'api' weert geen ander bestand: apple-touch-icon.png begint met 'app', niet met 'api'.
  - api
  - mockups
  - logo-pakket
  - vrijdagsoverzicht.html
  - docs
  - .superpowers
  - apps-script
  - apps-script-backup
  - apps-script-klaarstaand
  - README.md
  - BRAND-GUIDELINES.md
  - beheer-playbook.md
  - OVERDRACHT-subsidie-trajecten.md
# Let op: Jekyll matcht deze regels ook op PREFIX — 'apps-script' weert daardoor ook
# apps-script-backup. Zet hier daarom NOOIT een korte regel als 'src' of 'index': dan
# verdwijnt de app zelf van de site. 'apps-script-backup' staat er expliciet bij zodat het
# niet van die prefix-toevalligheid afhangt.
